name: Publish tested mod

on:
  workflow_dispatch:
    inputs:
      mod:
        description: Mod to distribute
        required: true
        type: choice
        options:
          - Armor_Inscriptions
          - Worthwhile_Treasures
          - Portal_Atlas_Map
          - Fish_Attractor_And_Traps
          - Andvaranaut_Enchanting
      version:
        description: Tested version (for example 0.5.2)
        required: true
        type: string
      sha256:
        description: SHA256 of the tested ZIP
        required: true
        type: string
      destination:
        description: Validate uploads nothing; other options publish immediately
        required: true
        default: validate
        type: choice
        options: [validate, thunderstore, nexus, both]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.mod }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOD: ${{ inputs.mod }}
      VERSION: ${{ inputs.version }}
      SHA256: ${{ inputs.sha256 }}
      DESTINATION: ${{ inputs.destination }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test package validation safeguards
        run: python -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Check inputs and fetch tested GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          catalog = json.loads(Path('tools/release/catalog.json').read_text())
          assert os.environ['MOD'] in catalog, 'Unknown mod'
          assert re.fullmatch(r'\d+\.\d+\.\d+', os.environ['VERSION']), 'Invalid version'
          assert re.fullmatch(r'[A-Fa-f0-9]{64}', os.environ['SHA256']), 'Invalid SHA256'
          PY
          mkdir -p release-work
          gh release download "$MOD/v$VERSION" --pattern "OctoberJemini-$MOD-$VERSION.zip" --dir release-work
      - name: Validate package against tagged source
        id: validate
        run: |
          python tools/release/validate.py --package "release-work/OctoberJemini-$MOD-$VERSION.zip" --mod "$MOD" --version "$VERSION" --sha256 "$SHA256" --ref "refs/tags/$MOD/v$VERSION"
      - name: Check publishing configuration before either upload
        if: inputs.destination != 'validate'
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN || secrets.THUNDERSTORETOKEN }}
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ['DESTINATION']
          data = json.loads(Path('release-work/validated.json').read_text())
          if target in ('thunderstore', 'both'):
              assert os.environ.get('THUNDERSTORE_TOKEN'), 'Add THUNDERSTORE_TOKEN to repository Actions secrets'
          if target in ('nexus', 'both'):
              assert os.environ.get('NEXUSMODS_API_KEY'), 'Add NEXUSMODS_API_KEY to repository Actions secrets'
              assert all(isinstance(data[k], int) and data[k] > 0 for k in ('nexus_mod_id', 'nexus_file_id')), 'Configure Nexus mod and file/group IDs in tools/release/catalog.json first'
          PY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - name: Install official Thunderstore CLI
        run: dotnet tool install --global tcli --version 0.2.4
      - name: Verify Thunderstore CLI is runnable
        env:
          DOTNET_ROLL_FORWARD: Major
        run: tcli publish --help
      - name: Publish exact tested ZIP to Thunderstore
        if: inputs.destination == 'thunderstore' || inputs.destination == 'both'
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN || secrets.THUNDERSTORETOKEN }}
          DOTNET_ROLL_FORWARD: Major
        run: |
          tcli publish --config-path release-work/thunderstore.toml --file "release-work/OctoberJemini-$MOD-$VERSION.zip"
      - name: Publish exact tested ZIP to Nexus
        if: inputs.destination == 'nexus' || inputs.destination == 'both'
        id: nexus
        uses: Nexus-Mods/upload-action@63b8e77630af2d367f4c5bb27a5f5f926485d427
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.validate.outputs.nexus_file_id }}
          mod_id: ${{ steps.validate.outputs.nexus_mod_id }}
          filename: release-work/OctoberJemini-${{ inputs.mod }}-${{ inputs.version }}.zip
          version: ${{ inputs.version }}
          description: ${{ steps.validate.outputs.description }}
          display_name: ${{ inputs.mod }} ${{ inputs.version }}
          update_mod_version: 'true'
          archive_existing_version: 'false'
      - name: Record result
        env:
          NEXUS_VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('release-work/validated.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"## {data['mod']} {data['version']}\n\nDestination: {os.environ['DESTINATION']}\n\nSource commit: `{data['commit']}`\n\nPackage SHA256: `{data['sha256']}`\n\nPlugin SHA256: `{data['dll_sha256']}`\n")
              if os.environ['DESTINATION'] == 'validate':
                  f.write('\nValidation only: no store upload performed.\n')
              if os.environ.get('NEXUS_VERSION_ID'):
                  f.write('\nNexus file version ID: ' + os.environ['NEXUS_VERSION_ID'] + '\n')
          PY
